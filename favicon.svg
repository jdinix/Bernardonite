<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Fundo Circular Tático -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" />
  
  <!-- Círculo Externo da Mira Tática -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#00ff88" stroke-width="2" stroke-dasharray="8 3" filter="url(#glow)" />
  
  <!-- Círculo Interno -->
  <circle cx="32" cy="32" r="10" fill="none" stroke="#38bdf8" stroke-width="1.8" />
  
  <!-- Miras Retículas (Linhas Superiores, Inferiores, Laterais) -->
  <line x1="32" y1="4" x2="32" y2="18" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="32" y1="46" x2="32" y2="60" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="4" y1="32" x2="18" y2="32" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="46" y1="32" x2="60" y2="32" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Ponto Central Neon -->
  <circle cx="32" cy="32" r="3" fill="#facc15" stroke="#ffffff" stroke-width="1" filter="url(#glow)" />
</svg>
